# ===================================================================
# LifePulse - Test Configuration (H2 In-Memory Database)
# ===================================================================
spring.application.name=blood-alert-system-test
server.port=-1

# H2 Database in MySQL Mode
spring.datasource.url=jdbc:h2:mem:blood_alert_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates tables on startup and drops on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Centralized CORS property
cors.allowed-origins=http://localhost:3000,http://localhost:5500,https://lifepulse.test

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
