# ===================================================================
# LifePulse - Emergency Blood Alert System
# File: backend/src/main/resources/application.properties
# Description: Central configuration for Spring Boot, MySQL connection,
#              Hibernate JPA, and server environment.
# ===================================================================

# -------------------------------------------------------------------
# 1. APPLICATION & SERVER SETTINGS
# -------------------------------------------------------------------
spring.application.name=blood-alert-system
server.port=8080

# -------------------------------------------------------------------
# 2. MYSQL DATASOURCE CONFIGURATION
# -------------------------------------------------------------------
# Connects to MySQL on standard port 3306.
# 'createDatabaseIfNotExist=true' automatically creates 'blood_alert_db' if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/blood_alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Replace 'root' with your local MySQL password if different:
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# -------------------------------------------------------------------
# 'update' tells Hibernate to automatically validate and create/update tables 
# based on our Java @Entity classes (Alert, Donor, Hospital) without dropping data.
spring.jpa.hibernate.ddl-auto=update

# Print generated SQL statements in the console for learning and debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# 4. DATA INITIALIZATION & ENCODING
# -------------------------------------------------------------------
# Ensures UTF-8 encoding for internationalized names and medical notes
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
