# ===================================================================
# LifePulse - Emergency Blood Alert System
# File: backend/src/main/resources/application.properties
# Description: Central configuration for Spring Boot, MySQL connection,
#              Hibernate JPA, and server environment.
# ===================================================================

# -------------------------------------------------------------------
# 1. APPLICATION & SERVER SETTINGS
# -------------------------------------------------------------------
spring.application.name=blood-alert-system
server.port=${PORT:8080}

# -------------------------------------------------------------------
# 2. MYSQL DATASOURCE CONFIGURATION
# -------------------------------------------------------------------
# Dynamic environment variable overrides for Railway, Render, Docker, Azure, or local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blood_alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# -------------------------------------------------------------------
# 3. JPA / HIBERNATE SETTINGS
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
# Note: In Hibernate 6 (Spring Boot 3.x), dialect is automatically detected from JDBC metadata.

# -------------------------------------------------------------------
# 4. DATA INITIALIZATION & ENCODING
# -------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -------------------------------------------------------------------
# 5. CORS SECURITY CONFIGURATION
# -------------------------------------------------------------------
# Comma-separated list of allowed origins. Defaults to '*' for local dev.
# In production, lockdown to frontend domains via CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

