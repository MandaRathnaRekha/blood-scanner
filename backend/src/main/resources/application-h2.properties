# ===================================================================
# LifePulse - Emergency Blood Alert System
# File: backend/src/main/resources/application-h2.properties
# Description: Zero-setup local development profile with in-memory H2 database.
#              Enables instant running without a local MySQL server.
# Usage:
#   .\mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# ===================================================================

spring.application.name=blood-alert-system-h2
server.port=${PORT:8080}

# In-Memory H2 Database running in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:blood_alert_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates tables on startup and drops on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# CORS: open for local testing
cors.allowed-origins=*

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
