version: '3.8'

# ===================================================================
# LifePulse - Emergency Blood Alert System
# File: docker-compose.yml
# Description: Orchestrates local & cloud container deployment for
#              MySQL Database + Spring Boot REST Backend + Frontend Portal.
# Usage:
#   docker compose up --build
# ===================================================================

services:
  # -----------------------------------------------------------------
  # 1. MySQL 8.0 Database Service
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: lifepulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blood_alert_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - lifepulse-net

  # -----------------------------------------------------------------
  # 2. Spring Boot 3.3.4 REST API Backend (Java 21 LTS)
  # -----------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifepulse-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blood_alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lifepulse-net

  # -----------------------------------------------------------------
  # 3. Lightweight Nginx Web Server for Frontend Portal
  # -----------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: lifepulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - lifepulse-net

volumes:
  mysql_data:
    driver: local

networks:
  lifepulse-net:
    driver: bridge
